name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Generate ephemeral database credentials
        shell: bash
        run: |
          {
            echo "POSTGRES_ADMIN_PASSWORD=$(openssl rand -hex 32)"
            echo "IDENTITY_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "PARCEL_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "PAYMENT_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "COMMUNICATION_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "TRACKING_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "RABBITMQ_USER=swiftdrop"
            echo "RABBITMQ_PASSWORD=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Start PostgreSQL (same setup as local)
        run: docker compose up -d --wait

      - name: Build and test Identity service
        working-directory: services/identity-merchant-service
        run: ./mvnw -B verify

      - name: Build and test Tracking service
        working-directory: services/tracking-reporting-service
        run: ./mvnw -B verify

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs postgres

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test -- --no-watch
