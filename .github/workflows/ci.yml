name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    env:
      # Throwaway values: the CI database only exists for this run.
      POSTGRES_ADMIN_PASSWORD: ci-admin-password
      IDENTITY_DB_PASSWORD: ci-identity-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Start PostgreSQL (same setup as local)
        run: docker compose up -d --wait

      - name: Build and test
        working-directory: services/identity-merchant-service
        run: ./mvnw -B verify

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs postgres

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test -- --no-watch
