name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Generate ephemeral database credentials
        shell: bash
        run: |
          {
            echo "POSTGRES_ADMIN_PASSWORD=$(openssl rand -hex 32)"
            echo "IDENTITY_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "PARCEL_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "PAYMENT_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "DELIVERY_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "COMMUNICATION_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "TRACKING_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "RABBITMQ_USER=swiftdrop"
            echo "RABBITMQ_PASSWORD=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Start PostgreSQL and RabbitMQ (same setup as local)
        run: docker compose up -d --wait postgres rabbitmq

      - name: Build and test Identity service
        working-directory: services/identity-merchant-service
        run: ./mvnw -B verify

      - name: Build and test Delivery Operations service
        working-directory: services/delivery-operations-service
        run: ./mvnw -B verify

      - name: Build and test Tracking service
        working-directory: services/tracking-reporting-service
        run: ./mvnw -B verify

      - name: Build and test API Gateway
        working-directory: services/api-gateway
        run: ./mvnw -B verify

      - name: Show Compose status and Parcel logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=300 parcel-pricing-service

  payment:
    name: payment integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: payment-test-only
          POSTGRES_DB: payment_test
        ports: ['55485:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d payment_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: paymenttest
          RABBITMQ_DEFAULT_PASS: payment-test-only
        ports: ['56785:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      PAYMENT_TEST_DB_URL: jdbc:postgresql://localhost:55485/payment_test
      PAYMENT_TEST_RABBIT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Verify payment including database and broker tests
        working-directory: services/payment-settlement-service
        run: ./mvnw -B verify
      - name: Require integration tests to run
        shell: python
        run: |
          import pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('services/payment-settlement-service/target/surefire-reports')
          reports = list(root.glob('TEST-*IntegrationTest.xml'))
          assert len(reports) >= 2, 'Missing payment integration reports'
          for report in reports:
              suite = ET.parse(report).getroot()
              assert int(suite.attrib['tests']) > 0 and int(suite.attrib['skipped']) == 0, str(report)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-test-reports
          path: services/payment-settlement-service/target/surefire-reports

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test -- --no-watch
