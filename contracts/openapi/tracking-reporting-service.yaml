openapi: 3.1.0

info:
  title: SwiftDrop Tracking & Reporting Service
  version: 0.1.0
  summary: Public parcel tracking, authenticated tracking and live updates.
  description: |
    Privacy-safe tracking projections built from Parcel & Pricing and Delivery Operations events.
    Public responses contain only delivery status, customer-safe descriptions, general location
    labels and event times. They never contain customer contact details, full addresses, courier
    private information, proof files or internal issue notes.

servers:
  - url: http://localhost:8084
    description: Service running locally
  - url: http://localhost:8080
    description: Through the API gateway

tags:
  - name: Public tracking
  - name: Authenticated tracking
  - name: Reports

security:
  - bearerAuth: []

paths:
  /api/v1/public/tracking/{trackingNumber}:
    get:
      tags: [Public tracking]
      operationId: getPublicTrackingSummary
      summary: Get the current public tracking state
      security: []
      parameters:
        - $ref: '#/components/parameters/TrackingNumber'
      responses:
        '200':
          description: Current privacy-safe tracking state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackingSummary' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/TrackingNotFound' }

  /api/v1/public/tracking/{trackingNumber}/history:
    get:
      tags: [Public tracking]
      operationId: getPublicTrackingHistory
      summary: Get the ordered public tracking timeline
      security: []
      parameters:
        - $ref: '#/components/parameters/TrackingNumber'
      responses:
        '200':
          description: Oldest-to-newest privacy-safe tracking events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackingHistory' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/TrackingNotFound' }

  /api/v1/tracking/{trackingNumber}:
    get:
      tags: [Authenticated tracking]
      operationId: getTrackingSummary
      summary: Get the current tracking state as an authenticated caller
      parameters:
        - $ref: '#/components/parameters/TrackingNumber'
      responses:
        '200':
          description: Current privacy-safe tracking state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackingSummary' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/TrackingNotFound' }

  /api/v1/tracking/{trackingNumber}/stream:
    get:
      tags: [Authenticated tracking]
      operationId: streamTrackingUpdates
      summary: Receive committed tracking state changes using server-sent events
      parameters:
        - $ref: '#/components/parameters/TrackingNumber'
      responses:
        '200':
          description: |
            SSE stream containing `connected`, `tracking-snapshot`, `tracking-update` and
            `heartbeat` events. A current snapshot is sent whenever a client reconnects.
          content:
            text/event-stream:
              schema:
                type: string
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/TrackingNotFound' }

  /api/v1/reports/summary:
    get:
      tags: [Reports]
      operationId: getReportSummary
      summary: Get booking-cohort totals and delivery success rate
      description: Requires the `DISPATCHER` role.
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Summary for the selected UTC booking cohort
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSummary' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/reports/status-breakdown:
    get:
      tags: [Reports]
      operationId: getStatusBreakdown
      summary: Group booking-cohort parcels by current status
      description: Requires the `DISPATCHER` role.
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Current status totals for the selected booking cohort
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusBreakdown' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/reports/deliveries/daily:
    get:
      tags: [Reports]
      operationId: getDailyDeliveryCounts
      summary: Count distinct delivered parcels by UTC day
      description: Requires the `DISPATCHER` role. Zero-count days are omitted.
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Daily delivery counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryCounts' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/reports/deliveries/monthly:
    get:
      tags: [Reports]
      operationId: getMonthlyDeliveryCounts
      summary: Count distinct delivered parcels by UTC month
      description: Requires the `DISPATCHER` role. Zero-count months are omitted.
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Monthly delivery counts using the first date of each month
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryCounts' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TrackingNumber:
      name: trackingNumber
      in: path
      required: true
      description: Public SwiftDrop tracking reference
      schema:
        type: string
        pattern: '^SWD-[0-9]{4}-[0-9]{6,}$'
        example: SWD-2026-100001
    StartDate:
      name: startDate
      in: query
      required: false
      description: Inclusive UTC start date; omitted means no lower bound
      schema: { type: string, format: date }
    EndDate:
      name: endDate
      in: query
      required: false
      description: Inclusive UTC end date; omitted means no upper bound
      schema: { type: string, format: date }

  schemas:
    TrackingSummary:
      type: object
      additionalProperties: false
      required:
        - trackingNumber
        - currentStatus
        - publicDescription
        - latestUpdateTime
      properties:
        trackingNumber:
          type: string
          example: SWD-2026-100001
        currentStatus:
          type: string
          example: IN_TRANSIT
        publicDescription:
          type: string
          maxLength: 200
          example: Parcel is moving to the destination area
        safeLocation:
          type: [string, 'null']
          maxLength: 120
          example: Western Route
        latestUpdateTime:
          type: string
          format: date-time

    TrackingHistory:
      type: object
      additionalProperties: false
      required: [trackingNumber, events]
      properties:
        trackingNumber:
          type: string
          example: SWD-2026-100001
        events:
          type: array
          items: { $ref: '#/components/schemas/TrackingHistoryItem' }

    TrackingHistoryItem:
      type: object
      additionalProperties: false
      required: [status, publicDescription, eventTime]
      properties:
        status:
          type: string
          example: AT_WAREHOUSE
        publicDescription:
          type: string
          maxLength: 200
          example: Parcel received at the regional hub
        safeLocation:
          type: [string, 'null']
          maxLength: 120
          example: Colombo Hub
        eventTime:
          type: string
          format: date-time

    ReportSummary:
      type: object
      additionalProperties: false
      required:
        - totalParcelsBooked
        - parcelsCurrentlyInTransit
        - deliveredParcels
        - failedDeliveries
        - deliverySuccessRate
      properties:
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date }
        totalParcelsBooked: { type: integer, format: int64, minimum: 0 }
        parcelsCurrentlyInTransit: { type: integer, format: int64, minimum: 0 }
        deliveredParcels: { type: integer, format: int64, minimum: 0 }
        failedDeliveries: { type: integer, format: int64, minimum: 0 }
        deliverySuccessRate:
          type: number
          minimum: 0
          maximum: 100
          description: Delivered divided by delivered plus failed, as a percentage

    StatusBreakdown:
      type: object
      additionalProperties: false
      required: [statuses]
      properties:
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date }
        statuses:
          type: array
          items: { $ref: '#/components/schemas/StatusTotal' }

    StatusTotal:
      type: object
      additionalProperties: false
      required: [status, total]
      properties:
        status: { type: string }
        total: { type: integer, format: int64, minimum: 0 }

    DeliveryCounts:
      type: object
      additionalProperties: false
      required: [counts]
      properties:
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date }
        counts:
          type: array
          items: { $ref: '#/components/schemas/DeliveryCount' }

    DeliveryCount:
      type: object
      additionalProperties: false
      required: [period, deliveredParcels]
      properties:
        period:
          type: string
          format: date
          description: UTC day, or the first date of a UTC month
        deliveredParcels: { type: integer, format: int64, minimum: 0 }

    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }

  responses:
    ValidationFailed:
      description: Tracking number is malformed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: A valid access token is required
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The caller does not have the `DISPATCHER` role
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TrackingNotFound:
      description: No tracking projection exists for that tracking number
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
