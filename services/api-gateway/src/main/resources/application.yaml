server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IDENTITY_ISSUER_URI:swiftdrop-identity}
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          audiences: ${IDENTITY_AUDIENCE:swiftdrop-api}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-merchant-service
              uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/dispatchers/**,/api/v1/merchants/**,/api/v1/couriers/**,/oauth2/**,/login/oauth2/**,/.well-known/**
            - id: parcel-pricing-service
              uri: ${PARCEL_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/bookings/**,/api/v1/customer/profile/**,/api/pricing/**,/api/zones/**,/api/merchant/orders/**,/api/integrations/merchant/orders/**
            - id: delivery-operations-service
              uri: ${DELIVERY_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/sorting-records/**,/api/v1/transfers/**,/api/v1/warehouses/**,/api/v1/warehouse-parcels/**
            - id: tracking-reporting-service
              uri: ${TRACKING_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/public/tracking/**,/api/v1/tracking/**,/api/v1/reports/**
            - id: payment-settlement-service
              uri: ${PAYMENT_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/payments,/api/v1/payments/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
