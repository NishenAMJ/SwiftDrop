server:
  port: ${SERVER_PORT:8083}
  tomcat:
    # When an upload is refused for being too large, read and discard the rest of it (up to this much) before
    # answering. Otherwise the connection is cut mid-upload and the courier sees a network error, not the message.
    max-swallow-size: 16MB

spring:
  config:
    import: "optional:file:../../.env[.properties],optional:file:./.env[.properties]"
  application:
    name: delivery-operations-service
  datasource:
    url: ${DELIVERY_DB_URL:jdbc:postgresql://localhost:5432/swiftdrop}
    username: ${DELIVERY_DB_USER:delivery_user}
    password: ${DELIVERY_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: delivery_operations
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      # A proof file is at most 5 MB; the request limit leaves room for the JSON part.
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    enabled: true
    default-schema: delivery_operations
    schemas:
      - delivery_operations
    create-schemas: false
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: swiftdrop-identity
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          audiences: swiftdrop-api
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:swiftdrop}
    password: ${RABBITMQ_PASSWORD:}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    listener:
      simple:
        # Listens for parcel.cancelled. A message that keeps failing is retried a few times, then dead-lettered.
        auto-startup: true
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s

delivery:
  proof:
    # Where uploaded proof files are kept (a volume in Docker). Files are named by random ids.
    storage-dir: ${DELIVERY_PROOF_STORAGE_DIR:./data/proofs}
    max-bytes: 5242880
  parcel:
    # Parcel & Pricing, used to turn a tracking number into the parcel id that events must carry.
    base-url: ${DELIVERY_PARCEL_BASE_URL:http://localhost:8082}
    stub-enabled: ${DELIVERY_PARCEL_STUB_ENABLED:false}
  outbox:
    enabled: ${DELIVERY_OUTBOX_ENABLED:true}
    delay-ms: 2000
    table: delivery_operations.outbox_events

management:
  health:
    rabbit:
      enabled: ${RABBIT_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: ${spring.application.name}
    description: SwiftDrop warehouse and delivery operations
