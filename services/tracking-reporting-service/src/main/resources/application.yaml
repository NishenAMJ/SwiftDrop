server:
  port: 8084

spring:
  config:
    # Loads the root .env when run from this service directory or the repository root.
    import: "optional:file:../../.env[.properties],optional:file:./.env[.properties]"
  application:
    name: tracking-reporting-service

  datasource:
    url: ${TRACKING_DB_URL:jdbc:postgresql://localhost:5432/swiftdrop}
    username: ${TRACKING_DB_USER:tracking_user}
    password: ${TRACKING_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: tracking_reporting

  flyway:
    enabled: true
    default-schema: tracking_reporting
    schemas:
      - tracking_reporting
    create-schemas: false
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: swiftdrop-identity
          audiences: swiftdrop-api
          authorities-claim-name: roles
          authority-prefix: ROLE_

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
