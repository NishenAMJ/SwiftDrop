server:
  port: 8082

spring:
  config:
    import: "optional:file:../../.env[.properties],optional:file:./.env[.properties]"
  application:
    name: parcel-pricing-service

  datasource:
    url: ${PARCEL_DB_URL:jdbc:postgresql://localhost:5432/swiftdrop}
    username: ${PARCEL_DB_USER:parcel_pricing_user}
    password: ${PARCEL_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: parcel_pricing

  flyway:
    enabled: true
    default-schema: parcel_pricing
    schemas:
      - parcel_pricing
    create-schemas: false
    locations: classpath:db/migration

  # RabbitMQ: publish booking events, consume delivery and payment events
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 1s

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          audiences: swiftdrop-api

management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

swiftdrop:
  # Other services this one calls over REST (Docker values are set in compose.yaml)
  identity:
    base-url: ${SWIFTDROP_IDENTITY_BASE_URL:http://localhost:8081}
  payment:
    base-url: ${SWIFTDROP_PAYMENT_BASE_URL:http://localhost:8085}
  bookings:
    # Deducted from the refund when a paid online booking is cancelled before courier scheduling.
    cancellation-fee: ${SWIFTDROP_CANCELLATION_FEE:0.00}
  events:
    publisher:
      delay-ms: 2000
  # Temporary merchant order fee calculator (Member 4)
  orders:
    fee:
      mode: interim
      base: 300.00
      per-kg: 50.00
      urgent-surcharge: 200.00