server:
  port: 8086

spring:
  config:
    # Loads the root .env when you run from the service folder or the SwiftDrop root.
    import: "optional:file:../../.env[.properties],optional:file:./.env[.properties]"
  application:
    name: notification-webhook-service

  datasource:
    url: ${COMMUNICATION_DB_URL:jdbc:postgresql://localhost:5432/swiftdrop}
    username: ${COMMUNICATION_DB_USER:communication_user}
    password: ${COMMUNICATION_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification_webhook

  flyway:
    enabled: true
    default-schema: notification_webhook
    schemas:
      - notification_webhook
    create-schemas: false
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: swiftdrop-identity
          audiences: swiftdrop-api
          authorities-claim-name: roles
          authority-prefix: ROLE_

swiftdrop:
  notification:
    from-email: ${NOTIFICATION_FROM_EMAIL:noreply@swiftdrop.dev}
    tracking-base-url: ${TRACKING_BASE_URL:http://localhost:4200/track}
    parcel:
      email-statuses:
        - CREATED
        - PICKED_UP
        - IN_TRANSIT
        - OUT_FOR_DELIVERY
        - DELIVERED
        - FAILED
      sms-statuses:
        - OUT_FOR_DELIVERY
        - DELIVERED
        - FAILED
  webhook:
    encryption-key: ${WEBHOOK_ENCRYPTION_KEY:}
    allow-http: ${WEBHOOK_ALLOW_HTTP:true}
    allow-private-addresses: ${WEBHOOK_ALLOW_PRIVATE_ADDRESSES:true}
    poll-interval: ${WEBHOOK_POLL_INTERVAL:5s}
    retry-delays: ${WEBHOOK_RETRY_DELAYS:10s,30s,1m,2m,5m}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
