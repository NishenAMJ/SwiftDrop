spring:
  application:
    name: notification-webhook-service

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification_webhook

  flyway:
    enabled: true
    default-schema: notification_webhook
    schemas:
      - notification_webhook
    create-schemas: false
    locations: classpath:db/migration

  mail:
    host: localhost
    port: 1025

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json
          issuer-uri: swiftdrop-identity
          audiences: swiftdrop-api
          authorities-claim-name: roles
          authority-prefix: ROLE_

swiftdrop:
  notification:
    from-email: noreply@swiftdrop.dev
    tracking-base-url: http://localhost:4200/track
    parcel:
      email-statuses:
        - CREATED
        - PICKED_UP
        - IN_TRANSIT
        - OUT_FOR_DELIVERY
        - DELIVERED
        - FAILED
      sms-statuses:
        - OUT_FOR_DELIVERY
        - DELIVERED
        - FAILED
  webhook:
    encryption-key: "u8FwS2k7yL4fJ3e9A1bC5dE7gH8jK0mN2pQ4rS6tU8v="
    allow-http: true
    allow-private-addresses: true
    poll-interval: 200ms
    retry-delays: 100ms,200ms,300ms,400ms,500ms
