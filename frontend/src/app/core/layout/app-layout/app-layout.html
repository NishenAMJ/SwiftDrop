<a class="app-skip" href="#main-content" (click)="skipToMain($event, main)">Skip to main content</a>

<div class="app-shell" (keydown.escape)="closeMenu()">
  <header class="app-header">
    <div class="app-header__start">
      <button
        class="app-header__menu"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="app-nav"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          @if (menuOpen()) {
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          } @else {
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          }
        </svg>
        <span class="sd-visually-hidden">Menu</span>
      </button>
      <a class="app-header__brand" [routerLink]="home()">SwiftDrop</a>
    </div>

    <div class="app-header__end">
      @if (user(); as user) {
        <div class="app-header__who">
          <span class="app-header__name">{{ user.fullName }}</span>
          <span class="app-header__role">{{ roleLabel() }}</span>
        </div>
      }
      <button
        class="sd-button sd-button--secondary"
        type="button"
        (click)="logout()"
        [disabled]="signingOut()"
        [attr.aria-busy]="signingOut()"
      >
        @if (signingOut()) {
          <span class="sd-spinner" aria-hidden="true"></span>
          Logging out…
        } @else {
          Log out
        }
      </button>
    </div>
  </header>

  <!-- The column fills the page height; the links inside stay in view while scrolling. -->
  <div class="app-sidebar" [class.app-sidebar--open]="menuOpen()">
    <nav id="app-nav" class="app-nav" [class.app-nav--open]="menuOpen()" aria-label="Main">
      @for (group of navGroups(); track group.heading) {
        <div class="app-nav__group">
          <h2 class="app-nav__heading" [id]="'nav-' + group.heading">{{ group.heading }}</h2>
          <ul class="app-nav__list" [attr.aria-labelledby]="'nav-' + group.heading">
            @for (item of group.items; track item.path) {
              <li>
                <a
                  class="app-nav__link"
                  [routerLink]="item.path"
                  routerLinkActive="app-nav__link--active"
                  ariaCurrentWhenActive="page"
                >
                  {{ item.label }}
                </a>
              </li>
            }
          </ul>
        </div>
      }
    </nav>
  </div>

  <main #main id="main-content" class="app-main" tabindex="-1">
    <router-outlet />
  </main>
</div>
