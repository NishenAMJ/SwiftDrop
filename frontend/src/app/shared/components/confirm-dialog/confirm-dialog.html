<dialog
  #dialog
  class="sd-dialog"
  [class.sd-dialog--wide]="wide()"
  [attr.aria-labelledby]="id + '-title'"
  [attr.aria-describedby]="id + '-body'"
  (cancel)="onNativeCancel($event)"
>
  <form class="sd-dialog__form" (submit)="submit($event)" novalidate>
    <button type="button" class="sd-button sd-button--secondary sd-dialog__close" aria-label="Close dialog" (click)="dismiss()" [disabled]="busy()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
    </button>
    <h2 [id]="id + '-title'" class="sd-dialog__title">{{ title() }}</h2>

    <div [id]="id + '-body'" class="sd-dialog__body">
      <ng-content />
    </div>

    @if (text(); as field) {
      <div class="sd-field">
        <label class="sd-label" [for]="id + '-text'">
          {{ field.label }}
          @if (!field.required) {
            <span class="sd-label__optional">(optional)</span>
          }
        </label>
        <textarea
          [id]="id + '-text'"
          class="sd-input"
          [value]="value()"
          (input)="onInput($event)"
          [attr.maxlength]="field.maxLength"
          [attr.aria-invalid]="showTextError()"
          [attr.aria-describedby]="textDescribedBy()"
        ></textarea>
        @if (field.help) {
          <p [id]="id + '-help'" class="sd-help">{{ field.help }}</p>
        }
        @if (showTextError()) {
          <p [id]="id + '-error'" class="sd-error">{{ textError() }}</p>
        }
      </div>
    }

    @if (error(); as message) {
      <div class="sd-alert sd-alert--error" role="alert">{{ message }}</div>
    }

    @if (showCancel() || showConfirm()) {
      <div class="sd-dialog__actions">
        @if (showCancel()) {
          <button
            class="sd-button sd-button--secondary"
            type="button"
            (click)="cancel()"
            [disabled]="busy()"
          >
            {{ cancelLabel() }}
          </button>
        }
        @if (showConfirm()) {
          <button
            class="sd-button"
            [class.sd-button--primary]="tone() === 'primary'"
            [class.sd-button--danger]="tone() === 'danger'"
            type="submit"
            [disabled]="busy() || confirmDisabled()"
            [attr.aria-disabled]="confirmDisabled()"
            [attr.aria-busy]="busy()"
          >
            @if (busy()) {
              <span class="sd-spinner" aria-hidden="true"></span>
              Working…
            } @else {
              {{ confirmLabel() }}
            }
          </button>
        }
      </div>
    }
  </form>
</dialog>
